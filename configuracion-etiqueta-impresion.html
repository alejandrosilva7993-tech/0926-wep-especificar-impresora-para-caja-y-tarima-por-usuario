<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEP — Etiqueta de impresión</title>
  <link rel="icon" href="logo-wep-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/primeicons@7.0.0/primeicons.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="wep-topbar.css">
  <link rel="stylesheet" href="wep-sidebar.css">
  <link rel="stylesheet" href="wep-asn-print.css">
  <link rel="stylesheet" href="wep-label-config.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      font-size: 14px;
      color: #00263a;
      background: #fafafa;
    }

    .wep-shell { display: flex; flex-direction: column; min-height: 100vh; }
    .wep-body { display: flex; flex: 1; min-height: 0; }
  </style>
</head>
<body>

  <div class="wep-shell">

    <header class="wep-topbar">
      <div class="wep-topbar__bar">
        <button type="button" class="wep-topbar__menu" aria-label="Menú principal">
          <img src="hamburger-color.svg" alt="" class="wep-topbar__menu-icon">
        </button>

        <span class="wep-topbar__wep-app" aria-hidden="true">
          <img src="logo-wep-icon.svg" alt="" class="wep-topbar__wep-app-icon">
        </span>

        <div class="wep-topbar__brand">
          <span class="wep-topbar__brand-title">Warehouse</span>
          <span class="wep-topbar__brand-sub">Efficiency and productivity</span>
        </div>

        <div class="wep-topbar__spacer"></div>

        <label class="wep-topbar__search">
          <input type="search" placeholder="Búsqueda en WEP" aria-label="Búsqueda en WEP">
          <img src="icon-search.svg" alt="" class="wep-topbar__search-icon">
        </label>

        <div class="wep-topbar__actions">
          <button type="button" class="wep-topbar__action-btn wep-topbar__bell" aria-label="Notificaciones (1 sin leer)">
            <img src="icon-bell-inner.svg" alt="" class="wep-topbar__bell-shape">
            <span class="wep-topbar__badge" aria-hidden="true">
              <img src="badge-outer.svg" alt="" class="wep-topbar__badge-outer">
              <img src="badge-inner.svg" alt="" class="wep-topbar__badge-inner">
            </span>
          </button>
          <button type="button" class="wep-topbar__action-btn wep-topbar__settings" aria-label="Configuración">
            <img src="icon-settings-inner.svg" alt="" class="wep-topbar__settings-inner">
          </button>
          <img src="icon-user.svg" alt="" class="wep-topbar__avatar" aria-hidden="true">
        </div>
      </div>
    </header>

    <div class="wep-body">
      <nav class="wep-sidebar" id="wep-sidebar" aria-label="Navegación principal">
        <div class="wep-sidebar__nav">
          <button type="button" class="wep-sidebar__item" aria-label="Inicio">
            <img src="icon-01-home.svg" alt="" class="wep-sidebar__icon">
            <span class="wep-sidebar__label">Inicio</span>
          </button>
          <button type="button" class="wep-sidebar__item wep-sidebar__item--active" aria-label="Configuración" aria-current="page">
            <img src="icon-02-settings-active-bg.svg" alt="" class="wep-sidebar__active-bg">
            <img src="icon-02-settings.svg" alt="" class="wep-sidebar__icon">
            <span class="wep-sidebar__label">Configuración</span>
          </button>
          <button type="button" class="wep-sidebar__item" aria-label="Catálogos">
            <img src="icon-03.svg" alt="" class="wep-sidebar__icon">
            <span class="wep-sidebar__label">Catálogos</span>
          </button>
          <button type="button" class="wep-sidebar__item" aria-label="Recibo">
            <img src="icon-11.svg" alt="" class="wep-sidebar__icon wep-sidebar__icon--compact">
            <span class="wep-sidebar__label">Recibo</span>
          </button>
          <button type="button" class="wep-sidebar__item" aria-label="Surtido">
            <img src="icon-04.svg" alt="" class="wep-sidebar__icon">
            <span class="wep-sidebar__label">Surtido</span>
          </button>
          <button type="button" class="wep-sidebar__item" aria-label="Reubicar">
            <img src="icon-05.svg" alt="" class="wep-sidebar__icon">
            <span class="wep-sidebar__label">Reubicar</span>
          </button>
          <button type="button" class="wep-sidebar__item" aria-label="Reportes">
            <img src="icon-06.svg" alt="" class="wep-sidebar__icon">
            <span class="wep-sidebar__label">Reportes</span>
          </button>
          <button type="button" class="wep-sidebar__item" aria-label="Tareas">
            <img src="icon-07.svg" alt="" class="wep-sidebar__icon">
            <span class="wep-sidebar__label">Tareas</span>
          </button>
          <button type="button" class="wep-sidebar__item" aria-label="Inventario">
            <img src="icon-08.svg" alt="" class="wep-sidebar__icon">
            <span class="wep-sidebar__label">Inventario</span>
          </button>
          <button type="button" class="wep-sidebar__item" aria-label="Planeación">
            <img src="icon-09.svg" alt="" class="wep-sidebar__icon">
            <span class="wep-sidebar__label">Planeación</span>
          </button>
          <button type="button" class="wep-sidebar__item" aria-label="Embarque">
            <img src="icon-10.svg" alt="" class="wep-sidebar__icon">
            <span class="wep-sidebar__label">Embarque</span>
          </button>
        </div>
      </nav>

      <main class="main">
        <div class="asn-page label-config-page">

          <header class="page-header">
            <h1 class="page-header__title">Etiqueta de impresión</h1>
            <div class="page-header__divider"></div>
          </header>

          <form class="form-asn form-label-config" id="labelConfigForm" novalidate>

            <section class="form-section" aria-labelledby="section-impresoras">
              <div class="form-grid form-grid--2">
                <div class="field" id="field-usuario">
                  <label class="field__label" for="usuario">Usuario</label>
                  <div class="field__control field__control--locked field__control--value">
                    <input type="text" id="usuario" name="usuario" value="jperez — Juan Pérez" readonly aria-readonly="true" tabindex="-1">
                  </div>
                </div>

                <div class="field" id="field-almacen">
                  <label class="field__label" for="almacen">Almacén</label>
                  <div class="field__control field__control--locked field__control--value">
                    <input type="text" id="almacen" name="almacen" value="CEDIS Puebla" readonly aria-readonly="true" tabindex="-1">
                  </div>
                </div>
              </div>

              <header class="subsection-head">
                <h2 class="subsection-head__title" id="section-impresoras">Impresoras asignadas</h2>
                <div class="subsection-head__divider"></div>
              </header>

              <div class="form-grid form-grid--2">
                <div class="field" id="field-impresoraTarima">
                  <label class="field__label" for="impresoraTarima">
                    Impresora de etiqueta de tarima (LPN)
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>
                  <div class="field__control field__control--select">
                    <select id="impresoraTarima" name="impresoraTarima" required aria-required="true">
                      <option value="">Selecciona una impresora</option>
                    </select>
                    <img src="icon-expand-more.svg" alt="" class="field__chevron" aria-hidden="true">
                  </div>
                  <p class="field__error" id="impresoraTarima-error" hidden></p>
                </div>

                <div class="field" id="field-impresoraCaja">
                  <label class="field__label" for="impresoraCaja">
                    Impresora de etiqueta de caja
                    <span class="required-mark" aria-hidden="true">*</span>
                  </label>
                  <div class="field__control field__control--select">
                    <select id="impresoraCaja" name="impresoraCaja" required aria-required="true">
                      <option value="">Selecciona una impresora</option>
                    </select>
                    <img src="icon-expand-more.svg" alt="" class="field__chevron" aria-hidden="true">
                  </div>
                  <p class="field__error" id="impresoraCaja-error" hidden></p>
                </div>
              </div>
            </section>

            <div class="form-actions">
              <button type="submit" class="btn-save" id="btnSave" disabled>Guardar</button>
            </div>
          </form>

          <div class="pc-only-block">
            <span class="pc-only-block__icon" aria-hidden="true"><i class="pi pi-desktop"></i></span>
            <p class="pc-only-block__title">Disponible solo en PC</p>
            <p class="pc-only-block__text">
              La configuración de impresoras por usuario solo está disponible desde una computadora.
              Abre esta pantalla en un equipo de escritorio para continuar.
            </p>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="wep-label-config.js" defer></script>
</body>
</html>
